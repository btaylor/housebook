name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: housebook:test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Serve offline with persistent data
        run: |
          docker run -d --name housebook --platform "${{ matrix.platform }}" \
            --network none --mount type=volume,src=housebook-data,dst=/data housebook:test
          for attempt in $(seq 1 30); do
            if docker exec housebook node --input-type=module -e \
              'const r = await fetch("http://127.0.0.1:3000"); if (!r.ok || !(await r.text()).includes("Every House has a story.")) process.exit(1)'; then
              docker exec housebook node --input-type=module -e \
                'import { DatabaseSync } from "node:sqlite"; import { readMigrationFiles } from "drizzle-orm/migrator"; const db = new DatabaseSync("/data/housebook.sqlite", {readOnly:true}); if (db.prepare("SELECT count(*) AS count FROM __drizzle_migrations").get().count !== readMigrationFiles({migrationsFolder:"drizzle"}).length) process.exit(1); db.close()'
              exit 0
            fi
            sleep 1
          done
          docker logs housebook
          exit 1
