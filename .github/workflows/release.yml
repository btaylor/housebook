name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and set image tags
        id: version
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Expected a stable version tag vX.Y.Z; got %s\n' "$VERSION_TAG" >&2
            exit 1
          fi
          version="${VERSION_TAG#v}"
          image=ghcr.io/btaylor/housebook
          {
            printf 'tags<<EOF\n'
            printf '%s:%s\n' "$image" "$version" "$image" "${version%.*}" "$image" "${version%%.*}" "$image" latest
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
